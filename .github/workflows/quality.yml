name: AIIO quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint application
        run: npm run lint

      - name: Validate evidence registry
        run: npm run research:validate

      - name: Rebuild current evidence digest
        run: npm run digest:build

      - name: Verify digest artifacts are deterministic
        run: git diff --exit-code -- data/digests

      - name: Rebuild PSPE method-lineage report
        run: npm run pspe:lineage

      - name: Verify PSPE method lineage is deterministic
        run: git diff --exit-code -- data/model-runs/pspe_method_lineage_v0.1.json

      - name: Rebuild Canada cross-domain coverage
        run: npm run canada:coverage

      - name: Verify Canada coverage is deterministic
        run: git diff --exit-code -- data/model-runs/canada_cross_domain_coverage_v0.1.json

      - name: Rebuild research-surface provenance manifest
        run: npm run research-surface:build

      - name: Verify research-surface manifest is deterministic
        run: git diff --exit-code -- public/data/research-surface.json

      - name: Test graph, scenarios, schemas, and release controls
        run: npm run research:test

      - name: Build native Next.js deployment
        run: npm run build

      - name: Build Sites-compatible deployment
        run: npm run build:sites

      - name: Start production application for browser verification
        run: |
          npm start -- --hostname 127.0.0.1 --port 3002 > /tmp/aiio-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3002/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aiio-next.log
          exit 1

      - name: Audit public routes for blocking accessibility defects
        env:
          AIIO_BASE_URL: http://127.0.0.1:3002
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: npm run test:a11y
